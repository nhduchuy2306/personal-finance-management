server:
  port: 9080

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production-must-be-long-enough}
    issuer: personal-finance
  gateway:
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /actuator/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**
        - id: budget-service
          uri: lb://budget-service
          predicates:
            - Path=/api/v1/budgets/**, /api/v1/categories/**
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/v1/transactions/**
        - id: ocr-service
          uri: lb://ocr-service
          predicates:
            - Path=/api/v1/receipts/**
        - id: group-expense-service
          uri: lb://group-expense-service
          predicates:
            - Path=/api/v1/groups/**
        - id: recurring-bill-service
          uri: lb://recurring-bill-service
          predicates:
            - Path=/api/v1/recurring-bills/**
        - id: saving-service
          uri: lb://saving-service
          predicates:
            - Path=/api/v1/savings/**
