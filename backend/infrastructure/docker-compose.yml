services:
  # ══════════════════════════════════════════════
  # PostgreSQL — single instance, shared database
  # ══════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: pf-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pf-network

  # ══════════════════════════════════════════════
  # Kafka — Kraft mode (no Zookeeper)
  # ══════════════════════════════════════════════
  kafka:
    image: apache/kafka:3.9.0
    container_name: pf-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://pf-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@pf-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qg'
    ports:
      - "9092:9092"

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - pf-network

  # ══════════════════════════════════════════════
  # Redis Sentinel — 1 master + 2 replicas + 3 sentinels
  # ══════════════════════════════════════════════
  redis-master:
    image: redis:7-alpine
    container_name: pf-redis-master
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pf-network

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: pf-redis-sentinel-1
    command: sh -c "cp /tmp/sentinel.conf /data/sentinel.conf && redis-sentinel /data/sentinel.conf"
    volumes:
      - ./redis-sentinel/sentinel.conf:/tmp/sentinel.conf:ro
    ports:
      - "26379:26379"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - pf-network

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: pf-redis-sentinel-2
    command: sh -c "cp /tmp/sentinel.conf /data/sentinel.conf && redis-sentinel /data/sentinel.conf"
    volumes:
      - ./redis-sentinel/sentinel2.conf:/tmp/sentinel.conf:ro
    ports:
      - "26380:26379"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - pf-network

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: pf-redis-sentinel-3
    command: sh -c "cp /tmp/sentinel.conf /data/sentinel.conf && redis-sentinel /data/sentinel.conf"
    volumes:
      - ./redis-sentinel/sentinel3.conf:/tmp/sentinel.conf:ro
    ports:
      - "26381:26379"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - pf-network

  # ══════════════════════════════════════════════
  # MinIO — S3-compatible storage for OCR receipt images
  # ══════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: pf-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pf-network

  # ══════════════════════════════════════════════════════════
  #  MICROSERVICES — Boot Order: Discovery → Config → Business → Gateway
  # ══════════════════════════════════════════════════════════

  # ── 1. Discovery Service (Eureka) ──────────────────────
  discovery-service:
    build:
      context: ../services/discovery-service
      dockerfile: Dockerfile
    container_name: pf-discovery
    ports:
      - "9761:9761"
      - "5001:5005"
    volumes:
      - ./configs/discovery-service/application.yml:/app/config/application.yml:ro
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
      DEBUG_SUSPEND: "n"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9761/actuator/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - pf-network

  # ── 2. Config Service (Spring Cloud Config) ────────────
  config-service:
    build:
      context: ../services/config-service
      dockerfile: Dockerfile
    container_name: pf-config
    ports:
      - "9888:9888"
      - "5002:5005"
    volumes:
      - ./configs/config-service/application.yml:/app/config/application.yml:ro
      - ../services/config-service/src/main/resources/configs:/app/config-data:ro
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
      DEBUG_SUSPEND: "n"
    depends_on:
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9888/actuator/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - pf-network

  # ── 3. Auth Service ────────────────────────────────────
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: pf-auth
    ports:
      - "9081:9081"
      - "29081:29081"
      - "5003:5005"
    volumes:
      - ./configs/auth-service/application.yml:/app/config/application.yml:ro
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
      SPRING_PROFILES_ACTIVE: stag
      CONFIG_SERVER_HOST: pf-config
      DEBUG_SUSPEND: "n"
      JWT_SECRET: docker-dev-secret-key-change-in-production-must-be-long-enough-256-bits
      TELEGRAM_BOT_TOKEN: ""
    depends_on:
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9081/actuator/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - pf-network

  # ── 11. API Gateway (last to start) ────────────────────
  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: pf-gateway
    ports:
      - "9080:9080"
      - "5011:5005"
    volumes:
      - ./configs/api-gateway/application.yml:/app/config/application.yml:ro
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
      SPRING_PROFILES_ACTIVE: stag
      CONFIG_SERVER_HOST: pf-config
      DEBUG_SUSPEND: "n"
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9080/actuator/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - pf-network

volumes:
  postgres_data:
  redis_master_data:
  minio_data:

networks:
  pf-network:
    driver: bridge
