# ── API Gateway — Docker config override ──
# Points to config-service via Docker network
spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:stag}
  config:
    import: optional:configserver:http://pf-config:9888
  cloud:
    config:
      name: ${spring.application.name},discovery
      fail-fast: true
